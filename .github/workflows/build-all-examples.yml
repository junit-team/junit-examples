name: Build all examples
on:
  push:
    branches:
      - main
      - 'r5.*'
      - 'r6.*'
      - 'releases/**'
  pull_request:
  merge_group:

permissions:
  contents: read

jobs:
  linux:
    name: Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: 'Set up JDK 25'
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: 25
          distribution: liberica
          cache: maven
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          develocity-injection-enabled: true
          develocity-plugin-version: '4.6.0'
          develocity-ccud-plugin-version: '2.8.0'
          develocity-url: https://develocity.junit.org
          develocity-access-key: ${{ secrets.DEVELOCITY_ACCESS_KEY }}
      - run: cat .github/gradle.properties >> "$GRADLE_USER_HOME/gradle.properties"
      - uses: sbt/setup-sbt@ecad189dd245444b9ae0a0cd5922fd938b88906f # v1.5.12
      - uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
        with:
          module-root: junit-jupiter-starter-bazel
          bazelisk-cache: true
          disk-cache: true
      - name: 'Build all examples'
        run: java src/Builder.java
      - name: 'Check automation for updating versions'
        run: java src/Updater.java 42
        if: github.repository == 'junit-team/junit-examples' && github.ref == 'refs/heads/main'
      - name: 'Check automation for injecting a staging repository'
        run: java src/StagingRepoInjector.java https://example.org/service/local/repositories/orgjunit-1234/content
        if: github.repository == 'junit-team/junit-examples' && github.ref == 'refs/heads/main'
